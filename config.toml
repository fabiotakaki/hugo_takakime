baseURL = "/"
title = "Fabio S. Takaki - TakakiME"
theme = "takakime"
languageCode = "en-us"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableDefaultLanguageRedirect = false
disableLanguages = []

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = true
    noClasses = true
    style = "monokai"
    tabWidth = 4

[markup.goldmark.renderer]

[languages]
  [languages.en]
    languageCode = 'en-US'
    languageName = 'English'
    timeZone = 'America/Sao_Paulo'
    weight = 1
  
  [languages.pt-BR]
    languageCode = 'pt-BR'
    languageName = 'Portuguese'
    timeZone = 'America/Sao_Paulo'
    weight = 1
    