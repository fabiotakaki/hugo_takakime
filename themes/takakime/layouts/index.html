{{ define "main" }}
  <!-- Note that the content for index.html, as a sort of list page, will pull from content/_index.md -->
  <div class="intro">{{ .Content }}</div>
  <section class="posts-section">
    <h2 class="section-title">Posts</h2>
    <ul class="post-list">
      {{ range .Site.RegularPages }}
      <li class="post-row"><a class="post-row__title" href="{{ .RelPermalink }}">{{ .Title }}</a><span class="post-row__meta">{{ .Date.Format "Mon, Jan 2, 2006" }} · {{ math.Round (div (countwords .Content) 220.0) }}min</span>{{ if .Draft }}<span class="draft-label"> | DRAFT</span>{{ end }}</li>
      {{ end }}
    </ul>
  </section>
{{ end }}
