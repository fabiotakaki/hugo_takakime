<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Apply the saved theme before first paint. Unset = CSS follows the OS.
  // Placed before every stylesheet so it never waits on a CDN download.
  try {
    var savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light' || savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
  } catch (e) {
    // Intentionally empty: storage can be blocked; the OS preference applies.
  }
</script>
